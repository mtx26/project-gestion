<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invitation acceptée</title>
  </head>
  <body style="margin:0;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{{INVITEE_NAME}}} a rejoint votre projet.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f7f9;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e3e7ee;border-radius:8px;">
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#111827;">Invitation accept&eacute;e</h1>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">Bonjour,</p>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;"><strong>{{{INVITEE_NAME}}}</strong> a accept&eacute; votre invitation et a rejoint le projet <strong>{{{PROJECT_NAME}}}</strong>.</p>
                <p style="margin:0 0 24px;">
                  <a href="{{{PROJECT_URL}}}" style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:12px 18px;border-radius:6px;">Voir le projet</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
