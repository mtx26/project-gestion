services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    deploy:
      restart_policy:
        condition: any
    environment:
      POSTGRES_DB: project_gestion
      POSTGRES_USER: project_gestion
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ── MinIO (stockage S3) ─────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    deploy:
      restart_policy:
        condition: any
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9000"
      - "9002:9001"

  minio-init:
    image: minio/mc:latest
    deploy:
      restart_policy:
        condition: none
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
        mc mb --ignore-existing local/${S3_BUCKET_NAME:-project-documents};
        mc mb --ignore-existing local/${PROFILE_PICTURE_S3_BUCKET_NAME:-profile-pictures};
        mc anonymous set download local/${PROFILE_PICTURE_S3_BUCKET_NAME:-profile-pictures};
      "

  # ── Sauvegarde DB → Google Drive ─────────────────────────────────────────────
  backup:
    image: ghcr.io/mtx26/project-gestion-backup:latest
    deploy:
      restart_policy:
        condition: any
    depends_on:
      - db
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: project_gestion
      PGUSER: project_gestion
      PGPASSWORD: ${DB_PASSWORD:-changeme}
      GDRIVE_REMOTE: ${GDRIVE_REMOTE:-gdrive:project-gestion-backups}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      RCLONE_CONFIG_B64: ${RCLONE_CONFIG_B64:-}
    volumes:
      - backup_data:/backups

  # ── Django backend ──────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/mtx26/project-gestion-backend:latest
    deploy:
      restart_policy:
        condition: any
    depends_on:
      - db
      - minio-init
    environment:
      DATABASE_URL: postgresql://project_gestion:${DB_PASSWORD:-changeme}@db:5432/project_gestion
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://localhost:3000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_SIGNING_SECRET: ${RESEND_SIGNING_SECRET:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-project-documents}
      PROFILE_PICTURE_S3_BUCKET_NAME: ${PROFILE_PICTURE_S3_BUCKET_NAME:-profile-pictures}
      S3_REGION: ${S3_REGION:-us-east-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN:-}
    ports:
      - "8000:8000"

  # ── Next.js frontend ────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/mtx26/project-gestion-frontend:latest
    deploy:
      restart_policy:
        condition: any
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
  backup_data:
