name: Build & Push Backup

on:
  push:
    branches: [main]
    paths:
      - "infra/backup/**"
      - ".github/workflows/build-backup.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/backup/**"
      - ".github/workflows/build-backup.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./infra/backup
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/project-gestion-backup:latest
